name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: curve_sampler_linux
          - os: windows-latest
            artifact_name: curve_sampler_windows
          - os: macos-latest
            artifact_name: curve_sampler_macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libglib2.0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxcb-composite0-dev libxcb-render0-dev libxcb-shape0-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release -p curve_sampler

      - name: Package Artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          find target/release -name "*.clap" -exec cp {} staging/ \;
          find target/release -name "*.vst3" -exec cp -r {} staging/ \;
          cd staging && zip -r ../${{ matrix.artifact_name }}.zip .

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staging
          Get-ChildItem -Path target/release -Filter "*.clap" | Copy-Item -Destination staging
          Get-ChildItem -Path target/release -Filter "*.vst3" -Recurse | Copy-Item -Destination staging
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
