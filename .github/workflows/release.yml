name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_prefix: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_prefix: windows
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_prefix: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install additional macOS targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libx11-xcb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-util-dev

      - name: Build plugin (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p curve-sampler --target x86_64-apple-darwin
          cargo build --release -p curve-sampler --target aarch64-apple-darwin

      - name: Build plugin (non-macOS)
        if: runner.os != 'macOS'
        run: cargo build --release -p curve-sampler --target ${{ matrix.target }}

      - name: Prepare macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          VERSION="${{ github.ref_name }}"

          # Create universal binary
          lipo -create \
            target/x86_64-apple-darwin/release/libcurve_sampler.dylib \
            target/aarch64-apple-darwin/release/libcurve_sampler.dylib \
            -output libcurve_sampler_universal.dylib

          # Create CLAP bundle structure
          mkdir -p "CurveSampler.clap/Contents/MacOS"
          cp libcurve_sampler_universal.dylib "CurveSampler.clap/Contents/MacOS/CurveSampler"

          # Create CLAP Info.plist
          cat > "CurveSampler.clap/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CurveSampler</string>
              <key>CFBundleIdentifier</key>
              <string>com.alexandernutz.curve-sampler</string>
              <key>CFBundleName</key>
              <string>Curve Sampler</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Create VST3 bundle structure
          mkdir -p "CurveSampler.vst3/Contents/MacOS"
          cp libcurve_sampler_universal.dylib "CurveSampler.vst3/Contents/MacOS/CurveSampler"

          # Create VST3 Info.plist
          cat > "CurveSampler.vst3/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CurveSampler</string>
              <key>CFBundleIdentifier</key>
              <string>com.alexandernutz.curve-sampler.vst3</string>
              <key>CFBundleName</key>
              <string>Curve Sampler</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Move to artifacts
          mv CurveSampler.clap artifacts/
          mv CurveSampler.vst3 artifacts/

      - name: Prepare Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp target/release/libcurve_sampler.so artifacts/CurveSampler.so

      - name: Prepare Windows artifacts
        if: runner.os == 'Windows'
        run: |
          mkdir -p artifacts
          copy target/release/curve_sampler.dll artifacts/CurveSampler.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ github.ref_name }}
          path: artifacts/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/**/*
          draft: false
          prerelease: false
