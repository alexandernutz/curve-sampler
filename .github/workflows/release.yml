name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_prefix: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_prefix: windows
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_prefix: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build plugin
        run: cargo build --release -p curve-sampler

      - name: Prepare macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          # Copy CLAP bundle
          cp -r target/release/CurveSampler.clap artifacts/
          # Copy VST3 bundle
          cp -r target/release/CurveSampler.vst3 artifacts/

      - name: Prepare Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp target/release/libcurve_sampler.so artifacts/CurveSampler.so

      - name: Prepare Windows artifacts
        if: runner.os == 'Windows'
        run: |
          mkdir -p artifacts
          copy target/release/curve_sampler.dll artifacts/CurveSampler.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ github.ref_name }}
          path: artifacts/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/**/*
          draft: false
          prerelease: false
