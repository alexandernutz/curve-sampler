name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_prefix: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_prefix: windows
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_prefix: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install additional macOS targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libx11-xcb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-util-dev

      - name: Bundle plugin
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo xtask bundle curve-sampler --release --target x86_64-apple-darwin --target aarch64-apple-darwin
          else
            cargo xtask bundle curve-sampler --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION="${{ github.ref_name }}"
          PLATFORM="${{ matrix.artifact_prefix }}"

          # Copy bundles from nih-plug's output directory
          if [ -d "target/release/bundle" ]; then
            cd target/release/bundle
            for bundle in */CurveSampler.*; do
              if [ -d "$bundle" ]; then
                bundle_name=$(basename "$bundle")
                zip -r "../../artifacts/${bundle_name}-$PLATFORM-$VERSION.zip" "$bundle"
              fi
            done
          fi

      - name: Debug - List artifacts
        shell: bash
        run: |
          echo "=== Contents of artifacts/ ==="
          ls -lhR artifacts/ || echo "artifacts/ directory not found"
          echo ""
          echo "=== Contents of target/${{ matrix.target }}/release/ ==="
          ls -lh target/${{ matrix.target }}/release/ | grep -E "\.(clap|vst3|so|dll|dylib)" || echo "No plugin files found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curve-sampler-${{ matrix.artifact_prefix }}-${{ github.ref_name }}
          path: artifacts/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/**/*.zip
          draft: false
          prerelease: false
