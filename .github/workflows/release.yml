name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: curve_sampler_linux
          - os: windows-latest
            artifact_name: curve_sampler_windows
          - os: macos-latest
            artifact_name: curve_sampler_macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build plugin
        run: cargo build --release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/*.clap
            target/release/*.vst3
