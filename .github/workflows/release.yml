name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_prefix: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_prefix: windows
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_prefix: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install additional macOS targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libx11-xcb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-util-dev

      - name: Build plugin
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo build --release -p curve-sampler --target x86_64-apple-darwin
            cargo build --release -p curve-sampler --target aarch64-apple-darwin
          else
            cargo build --release -p curve-sampler --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Create bundles (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          VERSION="${{ github.ref_name }}"

          # Create universal binary
          lipo -create \
            target/x86_64-apple-darwin/release/libcurve_sampler.dylib \
            target/aarch64-apple-darwin/release/libcurve_sampler.dylib \
            -output libcurve_sampler_universal.dylib

          # Create and zip CLAP bundle
          mkdir -p CurveSampler.clap/Contents/MacOS
          cp libcurve_sampler_universal.dylib CurveSampler.clap/Contents/MacOS/CurveSampler
          cat > CurveSampler.clap/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CurveSampler</string>
              <key>CFBundleIdentifier</key>
              <string>com.alexandernutz.curve-sampler</string>
              <key>CFBundleManufacturer</key>
              <string>lx_ntz</string>
              <key>CFBundleName</key>
              <string>Curve Sampler</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          zip -r artifacts/CurveSampler.clap-macos-$VERSION.zip CurveSampler.clap

          # Create and zip VST3 bundle
          mkdir -p CurveSampler.vst3/Contents/MacOS
          cp libcurve_sampler_universal.dylib CurveSampler.vst3/Contents/MacOS/CurveSampler
          cat > CurveSampler.vst3/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CurveSampler</string>
              <key>CFBundleIdentifier</key>
              <string>com.alexandernutz.curve-sampler.vst3</string>
              <key>CFBundleManufacturer</key>
              <string>lx_ntz</string>
              <key>CFBundleName</key>
              <string>Curve Sampler</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          zip -r artifacts/CurveSampler.vst3-macos-$VERSION.zip CurveSampler.vst3

      - name: Create bundles (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION="${{ github.ref_name }}"
          BINARY="target/${{ matrix.target }}/release/libcurve_sampler.so"

          # Create CLAP bundle
          mkdir -p CurveSampler.clap/Contents/MacOS
          cp "$BINARY" CurveSampler.clap/Contents/MacOS/CurveSampler
          cat > CurveSampler.clap/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CurveSampler</string>
              <key>CFBundleIdentifier</key>
              <string>com.alexandernutz.curve-sampler</string>
              <key>CFBundleManufacturer</key>
              <string>lx_ntz</string>
              <key>CFBundleName</key>
              <string>Curve Sampler</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          zip -r artifacts/CurveSampler.clap-linux-$VERSION.zip CurveSampler.clap

          # Create VST3 bundle
          mkdir -p CurveSampler.vst3/Contents/MacOS
          cp "$BINARY" CurveSampler.vst3/Contents/MacOS/CurveSampler
          cat > CurveSampler.vst3/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CurveSampler</string>
              <key>CFBundleIdentifier</key>
              <string>com.alexandernutz.curve-sampler.vst3</string>
              <key>CFBundleManufacturer</key>
              <string>lx_ntz</string>
              <key>CFBundleName</key>
              <string>Curve Sampler</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          zip -r artifacts/CurveSampler.vst3-linux-$VERSION.zip CurveSampler.vst3

      - name: Create bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          $VERSION = "${{ github.ref_name }}"
          $BINARY = "target\${{ matrix.target }}\release\curve_sampler.dll"

          # Create CLAP bundle
          New-Item -ItemType Directory -Path "CurveSampler.clap\Contents\MacOS" -Force | Out-Null
          Copy-Item "$BINARY" "CurveSampler.clap\Contents\MacOS\CurveSampler"
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CurveSampler</string>
              <key>CFBundleIdentifier</key>
              <string>com.alexandernutz.curve-sampler</string>
              <key>CFBundleManufacturer</key>
              <string>lx_ntz</string>
              <key>CFBundleName</key>
              <string>Curve Sampler</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          "@ | Set-Content "CurveSampler.clap\Contents\Info.plist"
          Compress-Archive -Path "CurveSampler.clap" -DestinationPath "artifacts\CurveSampler.clap-windows-$VERSION.zip"

          # Create VST3 bundle
          New-Item -ItemType Directory -Path "CurveSampler.vst3\Contents\MacOS" -Force | Out-Null
          Copy-Item "$BINARY" "CurveSampler.vst3\Contents\MacOS\CurveSampler"
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CurveSampler</string>
              <key>CFBundleIdentifier</key>
              <string>com.alexandernutz.curve-sampler.vst3</string>
              <key>CFBundleManufacturer</key>
              <string>lx_ntz</string>
              <key>CFBundleName</key>
              <string>Curve Sampler</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          "@ | Set-Content "CurveSampler.vst3\Contents\Info.plist"
          Compress-Archive -Path "CurveSampler.vst3" -DestinationPath "artifacts\CurveSampler.vst3-windows-$VERSION.zip"


      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curve-sampler-${{ matrix.artifact_prefix }}-${{ github.ref_name }}
          path: artifacts/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/**/*.zip
          draft: false
          prerelease: false
