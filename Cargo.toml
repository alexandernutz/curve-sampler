[package]
name = "zebra-curve-transform"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = "0.29"
egui = "0.29"
rustfft = "6"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "Document",
    "Element",
    "GainNode",
    "HtmlCanvasElement",
    "MidiAccess",
    "MidiPort",
    "MidiInput",
    "MidiInputMap",
    "MidiMessageEvent",
    "Navigator",
    "OscillatorNode",
    "PeriodicWave",
    "PeriodicWaveConstraints",
    "Window",
] }

[profile.release]
opt-level = 2
