[package]
name = "curve-sampler"
version = "0.2.4"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
debug-log = []
fps-display = []
no-repaint-throttle = []

[dependencies]
curve-core = { path = "../core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["opengl"] }
log = "0.4"
parking_lot = "0.12"
rustfft = "6"
